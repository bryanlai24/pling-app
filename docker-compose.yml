services:
  db:
    image: postgres:16
    container_name: pling-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pling
    ports:
      - "5432:5432"
    volumes:
      - pling_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./pling-server
      dockerfile: Dockerfile.dev
    container_name: pling-server
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/pling
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
      PSN_NPSSO_TOKEN: ${PSN_NPSSO_TOKEN}
      XBOX_CLIENT_ID: ${XBOX_CLIENT_ID}
      XBOX_CLIENT_SECRET: ${XBOX_CLIENT_SECRET}
      STEAM_API_KEY: ${STEAM_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./pling-server:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  client:
    build:
      context: ./pling-client
      dockerfile: Dockerfile.dev
    container_name: pling-client
    ports:
      - "5173:5173"
    volumes:
      - ./pling-client:/app
      - /app/node_modules
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pling_db_data: